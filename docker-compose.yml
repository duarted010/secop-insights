services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: secop
      POSTGRES_PASSWORD: secop
      POSTGRES_DB: secop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secop"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://secop:secop@db:5432/secop
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
